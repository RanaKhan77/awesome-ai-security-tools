name: apply-entry
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply entries insertion
        run: |
          python3 - << 'PYEOF'
          import io, sys, json, re
          path = "data/sections.json"
          title_target = "AI/ML Supply Chain & Model Security"
          e1 = {"name": "DeepSeek Exposure Scan", "repo": "dylanXM/deepseek-scanner", "org": "dylanXM", "desc": "Zero-dependency CLI that scans a codebase for DeepSeek components (API endpoints, SDK imports, dependency entries, container pulls, model artifacts) and generates a file:line evidence report for supplier disclosure.", "status": ["open_source"], "flags": ["early_stage"], "license": "Apache-2.0", "metrics": {"stars": 0, "updated": "2026-10-22", "snapshot": "2026-10-23"}}
          e2 = {"name": "litellm-check", "repo": "dylanXM/litellm-check", "org": "dylanXM", "desc": "Read-only CLI that scans manifests, lockfiles, container definitions, and installed Python environments for exposure to the compromised LiteLLM v1.107.0 release, using only checks from LiteLLM's official incident announcement, and writes an evidence report.", "status": ["open_source"], "flags": ["early_stage"], "license": "Apache-2.0", "metrics": {"stars": 0, "updated": "2026-10-22", "snapshot": "2026-10-23"}}
          def find_secs(obj, out):
              if isinstance(obj, dict):
                  if obj.get("title") == title_target and "entries" in obj:
                      out.append(obj)
                  for v in obj.values():
                      find_secs(v, out)
              elif isinstance(obj, list):
                  for v in obj:
                      find_secs(v, out)
          text = io.open(path, encoding="utf-8").read()
          if "dylanXM/deepseek-scanner" in text or "dylanXM/litellm-check" in text:
              print("already present")
              sys.exit(0)
          secs = []
          find_secs(json.loads(text), secs)
          assert len(secs) == 1, "section count %s" % len(secs)
          n0 = len(secs[0]["entries"])
          tpos = text.find(title_target)
          assert tpos > 0
          epos = text.find('"entries"', tpos)
          assert epos > tpos
          bpos = text.find("[", epos)
          depth = 0
          in_str = False
          esc = False
          end = -1
          for k in range(bpos, len(text)):
              ch = text[k]
              if in_str:
                  if esc:
                      esc = False
                  elif ch == "\\":
                      esc = True
                  elif ch == '"':
                      in_str = False
              else:
                  if ch == '"':
                      in_str = True
                  elif ch == "[":
                      depth += 1
                  elif ch == "]":
                      depth -= 1
                      if depth == 0:
                          end = k
                          break
          assert end > bpos, "entries array end not found"
          inner = text[bpos + 1:end]
          m = re.search(r"\n([ \t]*)\{", inner)
          assert m, "no entry object found"
          entry_indent = m.group(1)
          ls = text.rfind("\n", 0, epos) + 1
          key_indent = text[ls:epos]
          step = entry_indent[len(key_indent):] if entry_indent.startswith(key_indent) and len(entry_indent) > len(key_indent) else "  "
          ekey = entry_indent + step
          ls2 = text.rfind("\n", 0, end) + 1
          close_ws = text[ls2:end]
          def fmt(e):
              rows = [entry_indent + "{"]
              for kk in ["name", "repo", "org", "desc"]:
                  rows.append(ekey + '"' + kk + '": "' + e[kk] + '",')
              rows.append(ekey + '"status": ["open_source"],')
              rows.append(ekey + '"flags": ["early_stage"],')
              rows.append(ekey + '"license": "Apache-2.0",')
              rows.append(ekey + '"metrics": { "stars": 0, "updated": "2026-10-22", "snapshot": "2026-10-23" }')
              rows.append(entry_indent + "}")
              return "\n".join(rows)
          inner_r = inner.rstrip()
          assert inner_r.endswith("}")
          new_inner = inner_r + ",\n" + fmt(e1) + ",\n" + fmt(e2) + "\n" + close_ws
          new_text = text[:bpos + 1] + new_inner + text[end:]
          secs2 = []
          find_secs(json.loads(new_text), secs2)
          assert len(secs2) == 1
          ents = secs2[0]["entries"]
          assert len(ents) == n0 + 2, "entries %s -> %s" % (n0, len(ents))
          assert ents[-2] == e1 and ents[-1] == e2, "appended entries mismatch"
          io.open(path, "w", encoding="utf-8", newline="\n").write(new_text)
          print("appended 2 entries; section entries now", len(ents))
          PYEOF
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-entry.yml
          git add -A
          git commit -m "Add DeepSeek Exposure Scan and litellm-check to AI/ML Supply Chain & Model Security"
          git push
